name: Surveillance Cave a Liqueur

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v3

      - name: Installer Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Exécuter le script
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
        run: python tracker.py

      - name: Publier la mise à jour de la page web
        run: |
          git config --global user.name "GitHub Action Tracker"
          git config --global user.email "tracker@actions.github.com"
          git add index.html annonces_vues.db || true
          git commit -m "Mise à jour du tableau de bord" || exit 0
          git push
